btn2{border:2px solid #c2185b;border-radius:14px;padding:10px 16px;font:800 14px 'Nunito',system-ui,sans-serif;color:#8e1146;background:#fff;cursor:pointer;min-height:44px}\n.opt{display:block;width:100%;text-align:left;border:2px solid #d9c7ee;border-radius:14px;padding:14px 16px;font:700 16px 'Nunito',system-ui,sans-serif;color:#2a1740;background:#fff;cursor:pointer;margin-bottom:10px;min-height:48px}\n.inp{border:2px solid #d9c7ee;border-radius:12px;padding:12px;font:700 16px 'Nunito',system-ui,sans-serif;color:#2a1740;min-width:0;flex:1 1 200px}\n.fl{position:absolute;font-size:26px;animation:fl 5s ease-in infinite;opacity:0}\n@keyframes fl{0%{transform:translateY(40px) scale(.7);opacity:0}25%{opacity:1}100%{transform:translateY(-120px) scale(1.2);opacity:0}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"position:relative;min-height:1000px;overflow:hidden;box-sizing:border-box;{{bgStyle}}\" data-canvas-width=\"1280\" data-canvas-height=\"1500\" data-document-role=\"page\" data-label=\"K53 App\">\n<div style=\"position:absolute;inset:0;background:#1a0630;opacity:{{dimVal}};pointer-events:none\"><\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position:absolute;top:120px;left:0;right:0;text-align:center;font:900 clamp(40px,10vw,120px) 'Nunito',sans-serif;color:rgba(255,255,255,.12);pointer-events:none;letter-spacing:4px\">{{fullName}}<\u002Fdiv>\n<div style=\"position:relative;max-width:980px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:18px\">\n\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;color:#fff\">\n<div style=\"font:900 22px 'Nunito',sans-serif\">❤️ K53 for {{fullName}}<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center\">\n<div style=\"background:#fffdf9;color:#8e1146;border-radius:999px;padding:8px 16px;font-weight:900\">⭐ {{pts}} pts<\u002Fdiv>\n<button class=\"btn2\" sc-camel-on-click=\"{{toggleMute}}\" aria-label=\"Mute or unmute sound\">{{muteLabel}}<\u002Fbutton>\n<button class=\"btn2\" sc-camel-on-click=\"{{toggleSave}}\">Save Code<\u002Fbutton>\n<\u002Fdiv><\u002Fdiv>\n\n<sc-if value=\"{{ saveOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"card\" style=\"display:flex;flex-direction:column;gap:10px\">\n<b>Backup save code — copy it somewhere safe, or paste one to restore.<\u002Fb>\n<textarea class=\"inp\" rows=\"3\" style=\"flex:none\" sc-camel-on-change=\"{{onSaveTxt}}\">{{saveTxt}}<\u002Ftextarea>\n<div style=\"display:flex;gap:10px;flex-wrap:wrap\"><button class=\"btn2\" sc-camel-on-click=\"{{copySave}}\">Copy Save Code<\u002Fbutton><button class=\"btn2\" sc-camel-on-click=\"{{restoreSave}}\">Restore Save<\u002Fbutton><\u002Fdiv>\n<div>{{saveMsg}}<\u002Fdiv>\n<\u002Fdiv><\u002Fsc-if>\n\n<sc-if value=\"{{ sWelcome }}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"card\" style=\"position:relative;display:flex;flex-direction:column;gap:18px;background:linear-gradient(160deg,#fff7fb,#fff3e6)\">\n<span class=\"fl\" style=\"left:6%;top:60px\">❤️<\u002Fspan><span class=\"fl\" style=\"left:30%;top:90px;animation-delay:1.2s\">💖<\u002Fspan><span class=\"fl\" style=\"left:55%;top:70px;animation-delay:2.4s\">💕<\u002Fspan><span class=\"fl\" style=\"left:80%;top:100px;animation-delay:3.4s\">❤️<\u002Fspan><span class=\"fl\" style=\"left:92%;top:50px;animation-delay:.6s\">💖<\u002Fspan>\n<div style=\"font:900 34px 'Nunito',sans-serif;color:#c2185b\">Hello, Hasandi wa Sphe 💕<\u002Fdiv>\n<div style=\"font-size:18px;line-height:1.5\">This one was made just for you. Pick your Code, learn the real K53 rules, and keep every point you earn — it all saves automatically.<\u002Fdiv>\n<sc-if value=\"{{ hasSave }}\" hint-placeholder-val=\"{{ false }}\">\n<button class=\"btn\" sc-camel-on-click=\"{{continueGame}}\">❤️ Welcome Back, Hasandi wa Sphe — Continue Stage {{stage}} ({{pts}} pts)<\u002Fbutton>\n<\u002Fsc-if>\n<div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n<input class=\"inp\" placeholder=\"First name\" value=\"{{first}}\" sc-camel-on-change=\"{{onFirst}}\" aria-label=\"First name\">\n<input class=\"inp\" placeholder=\"Surname\" value=\"{{last}}\" sc-camel-on-change=\"{{onLast}}\" aria-label=\"Surname\">\n<\u002Fdiv>\n<div><b>Choose your Code (required)<\u002Fb>\n<div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:8px\">\n<sc-for list=\"{{ codes }}\" as=\"c\" hint-placeholder-count=\"3\">\n<button sc-camel-on-click=\"{{ c.pick }}\" style=\"flex:1 1 220px;border-radius:16px;padding:14px;font:800 15px 'Nunito',sans-serif;cursor:pointer;min-height:56px;{{c.style}}\">{{c.label}}<\u002Fbutton>\n<\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n<div><b>Make it yours — background<\u002Fb>\n<div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;align-items:center\">\n<sc-for list=\"{{ presets }}\" as=\"p\" hint-placeholder-count=\"5\">\n<button aria-label=\"Background preset\" sc-camel-on-click=\"{{ p.pick }}\" style=\"width:48px;height:48px;border-radius:50%;border:3px solid #fff;cursor:pointer;{{p.style}}\"><\u002Fbutton>\n<\u002Fsc-for>\n<label class=\"btn2\" style=\"display:inline-flex;align-items:center\">Upload image<input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{onFile}}\" style=\"display:none\"><\u002Flabel>\n<label>Dim <input type=\"range\" min=\"0\" max=\"80\" value=\"{{dim}}\" sc-camel-on-change=\"{{onDim}}\"><\u002Flabel>\n<\u002Fdiv><\u002Fdiv>\n<button class=\"btn\" sc-camel-on-click=\"{{startGame}}\">Start my K53 journey 🚗<\u002Fbutton>\n<div>{{welcomeMsg}}<\u002Fdiv>\n<\u002Fdiv><\u002Fsc-if>\n\n<sc-if value=\"{{ sStages }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"card\">\n<div style=\"font:900 26px 'Nunito',sans-serif\">Your stages — {{codeName}}<\u002Fdiv>\n<div style=\"margin:6px 0 16px\">Pass a stage with 70% or more to open the next tier. Wrong answers cost points, so read carefully.<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px\">\n<sc-for list=\"{{ stages }}\" as=\"s\" hint-placeholder-count=\"6\">\n<button sc-camel-on-click=\"{{ s.go }}\" style=\"text-align:left;border-radius:16px;padding:14px;font:700 14px 'Nunito',sans-serif;cursor:pointer;min-height:96px;{{s.style}}\"><b style=\"font-size:18px\">Stage {{s.id}}<\u002Fb><br>{{s.info}}<br>{{s.status}}<\u002Fbutton>\n<\u002Fsc-for><\u002Fdiv>\n<div style=\"margin-top:16px\"><button class=\"btn2\" sc-camel-on-click=\"{{openStudy}}\">📚 Study flashcards<\u002Fbutton><\u002Fdiv>\n<div style=\"margin-top:8px\">{{stageMsg}}<\u002Fdiv>\n<\u002Fdiv><\u002Fsc-if>\n\n<sc-if value=\"{{ sLock }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"card\" style=\"text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center\">\n<div style=\"font:900 30px 'Nunito',sans-serif;color:#b71c1c\">🔒 Out of points<\u002Fdiv>\n<div style=\"font-size:18px;max-width:560px\">Everything is locked. Read through the recovery flashcards from the first to the last card to earn 100 points and get back on the road.<\u002Fdiv>\n<button class=\"btn\" sc-camel-on-click=\"{{startRecover}}\">Start recovery flashcards<\u002Fbutton>\n<\u002Fdiv><\u002Fsc-if>\n\n<sc-if value=\"{{ sQuiz }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"card\">\n<div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:900;color:#8e1146\"><span>Stage {{stage}} · Question {{qn}} of {{qTotal}}<\u002Fspan><span>+{{up}} / −{{dn}}<\u002Fspan><\u002Fdiv>\n<div style=\"font:800 22px/1.35 'Nunito',sans-serif;margin:16px 0\">{{qText}}<\u002Fdiv>\n<sc-for list=\"{{ opts }}\" as=\"o\" hint-placeholder-count=\"4\">\n<button class=\"opt\" sc-camel-on-click=\"{{ o.pick }}\" style=\"{{o.style}}\">{{o.text}}<\u002Fbutton>\n<\u002Fsc-for>\n<sc-if value=\"{{ showWhy }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#f6efff;border-radius:14px;padding:14px;margin:8px 0\">{{whyHead}} {{why}}<\u002Fdiv>\n<button class=\"btn\" sc-camel-on-click=\"{{nextQ}}\">{{nextLabel}}<\u002Fbutton>\n<\u002Fsc-if><\u002Fdiv><\u002Fsc-if>\n\n<sc-if value=\"{{ sResult }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"card\" style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"font:900 30px 'Nunito',sans-serif;color:{{resColor}}\">{{resHead}}<\u002Fdiv>\n<div style=\"font-size:18px\">{{resLine}}<\u002Fdiv>\n<button class=\"btn\" sc-camel-on-click=\"{{afterResult}}\">{{afterLabel}}<\u002Fbutton>\n<div style=\"font:900 20px 'Nunito',sans-serif;margin-top:8px\">Question review<\u002Fdiv>\n<sc-for list=\"{{ review }}\" as=\"r\" hint-placeholder-count=\"3\">\n<div style=\"border-radius:14px;padding:12px;border:2px solid {{r.color}};background:#fff\"><b>{{r.q}}<\u002Fb><br>Your answer: {{r.mine}}<br>Correct: {{r.right}}<br><i>{{r.why}}<\u002Fi><\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"font:900 20px 'Nunito',sans-serif;margin-top:8px\">Study notes<\u002Fdiv>\n<div style=\"line-height:1.6\"><b>Speed &amp; distance:<\u002Fb> urban 60, open road 100, freeway 120 km/h. Keep at least a 2-second gap, more in rain, fog or at night.<br><b>Junctions:<\u002Fb> dead traffic light = four-way stop; first there goes first, ties go to the right; give way inside roundabouts.<br><b>Safety:<\u002Fb> BAC limit 0.05 g/100 ml; hooter only for danger; belts for everyone; dip lights within 150 m.<br><b>Breakdowns:<\u002Fb> triangle 45 m behind on open roads; stop at the left edge.<\u002Fdiv>\n<button class=\"btn2\" sc-camel-on-click=\"{{openStudy}}\">📚 Open flashcards<\u002Fbutton>\n<\u002Fdiv><\u002Fsc-if>\n\n<sc-if value=\"{{ sFlash }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"card\" style=\"display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center\">\n<div style=\"font-weight:900;color:#8e1146\">{{flashHead}} · Card {{fn}} of {{fTotal}}<\u002Fdiv>\n<div style=\"width:150px;height:150px\">\n<sc-if value=\"{{ card.isStop }}\"><svg sc-camel-view-box=\"0 0 100 100\" role=\"img\" aria-label=\"Stop sign\" width=\"150\" height=\"150\"><polygon points=\"30,4 70,4 96,30 96,70 70,96 30,96 4,70 4,30\" fill=\"#d32f2f\" stroke=\"#fff\" stroke-width=\"4\"><\u002Fpolygon><text x=\"50\" y=\"58\" font-size=\"26\" font-weight=\"900\" text-anchor=\"middle\" fill=\"#fff\" font-family=\"sans-serif\">STOP<\u002Ftext><\u002Fsvg><\u002Fsc-if>\n<sc-if value=\"{{ card.isYield }}\"><svg sc-camel-view-box=\"0 0 100 100\" role=\"img\" aria-label=\"Yield sign\" width=\"150\" height=\"150\"><polygon points=\"6,12 94,12 50,92\" fill=\"#fff\" stroke=\"#d32f2f\" stroke-width=\"10\" stroke-linejoin=\"round\"><\u002Fpolygon><\u002Fsvg><\u002Fsc-if>\n<sc-if value=\"{{ card.isNoEntry }}\"><svg sc-camel-view-box=\"0 0 100 100\" role=\"img\" aria-label=\"No entry sign\" width=\"150\" height=\"150\"><circle cx=\"50\" cy=\"50\" r=\"46\" fill=\"#d32f2f\"><\u002Fcircle><rect x=\"20\" y=\"42\" width=\"60\" height=\"16\" fill=\"#fff\"><\u002Frect><\u002Fsvg><\u002Fsc-if>\n<sc-if value=\"{{ card.isSpeed }}\"><svg sc-camel-view-box=\"0 0 100 100\" role=\"img\" aria-label=\"Speed limit 60\" width=\"150\" height=\"150\"><circle cx=\"50\" cy=\"50\" r=\"44\" fill=\"#fff\" stroke=\"#d32f2f\" stroke-width=\"10\"><\u002Fcircle><text x=\"50\" y=\"62\" font-size=\"34\" font-weight=\"900\" text-anchor=\"middle\" fill=\"#111\" font-family=\"sans-serif\">60<\u002Ftext><\u002Fsvg><\u002Fsc-if>\n<sc-if value=\"{{ card.isWarn }}\"><svg sc-camel-view-box=\"0 0 100 100\" role=\"img\" aria-label=\"Warning triangle\" width=\"150\" height=\"150\"><polygon points=\"50,8 94,88 6,88\" fill=\"#fff\" stroke=\"#d32f2f\" stroke-width=\"8\" stroke-linejoin=\"round\"><\u002Fpolygon><rect x=\"46\" y=\"34\" width=\"8\" height=\"30\" fill=\"#111\"><\u002Frect><circle cx=\"50\" cy=\"74\" r=\"5\" fill=\"#111\"><\u002Fcircle><\u002Fsvg><\u002Fsc-if>\n<sc-if value=\"{{ card.isRound }}\"><svg sc-camel-view-box=\"0 0 100 100\" role=\"img\" aria-label=\"Roundabout sign\" width=\"150\" height=\"150\"><circle cx=\"50\" cy=\"50\" r=\"46\" fill=\"#1565c0\"><\u002Fcircle><circle cx=\"50\" cy=\"50\" r=\"18\" fill=\"none\" stroke=\"#fff\" stroke-width=\"7\"><\u002Fcircle><polygon points=\"62,22 78,32 60,38\" fill=\"#fff\"><\u002Fpolygon><\u002Fsvg><\u002Fsc-if>\n<sc-if value=\"{{ card.isLight }}\"><svg sc-camel-view-box=\"0 0 100 100\" role=\"img\" aria-label=\"Traffic light\" width=\"150\" height=\"150\"><rect x=\"30\" y=\"4\" width=\"40\" height=\"92\" rx=\"10\" fill=\"#222\"><\u002Frect><circle cx=\"50\" cy=\"26\" r=\"11\" fill=\"#e53935\"><\u002Fcircle><circle cx=\"50\" cy=\"50\" r=\"11\" fill=\"#fbc02d\"><\u002Fcircle><circle cx=\"50\" cy=\"74\" r=\"11\" fill=\"#43a047\"><\u002Fcircle><\u002Fsvg><\u002Fsc-if>\n<sc-if value=\"{{ card.isNoOvertake }}\"><svg sc-camel-view-box=\"0 0 100 100\" role=\"img\" aria-label=\"No overtaking sign\" width=\"150\" height=\"150\"><circle cx=\"50\" cy=\"50\" r=\"44\" fill=\"#fff\" stroke=\"#d32f2f\" stroke-width=\"10\"><\u002Fcircle><rect x=\"26\" y=\"40\" width=\"22\" height=\"22\" fill=\"#d32f2f\"><\u002Frect><rect x=\"52\" y=\"40\" width=\"22\" height=\"22\" fill=\"#111\"><\u002Frect><\u002Fsvg><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"font:900 24px 'Nunito',sans-serif\">{{card.title}}<\u002Fdiv>\n<div style=\"max-width:560px;line-height:1.5\"><b>Trick:<\u002Fb> {{card.trick}}<br><b>Rule:<\u002Fb> {{card.rule}}<\u002Fdiv>\n<div style=\"display:flex;gap:10px;flex-wrap:wrap;justify-content:center\"><button class=\"btn2\" sc-camel-on-click=\"{{prevCard}}\">Back<\u002Fbutton><button class=\"btn\" sc-camel-on-click=\"{{nextCard}}\">{{flashBtn}}<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv><\u002Fsc-if>\n\n<sc-if value=\"{{ sWin }}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"card\" style=\"position:relative;text-align:center;padding:60px 24px;background:linear-gradient(160deg,#fff0f6,#fff6e8);overflow:hidden\">\n<span class=\"fl\" style=\"left:5%;top:200px;font-size:40px\">❤️<\u002Fspan><span class=\"fl\" style=\"left:22%;top:240px;font-size:40px;animation-delay:1s\">💖<\u002Fspan><span class=\"fl\" style=\"left:45%;top:220px;font-size:40px;animation-delay:2s\">💕<\u002Fspan><span class=\"fl\" style=\"left:68%;top:250px;font-size:40px;animation-delay:.5s\">❤️<\u002Fspan><span class=\"fl\" style=\"left:88%;top:210px;font-size:40px;animation-delay:3s\">💖<\u002Fspan>\n<div style=\"font-size:48px\">❤️ 💖 💕 ❤️ 💖 💕<\u002Fdiv>\n<div style=\"font:900 34px/1.3 'Nunito',sans-serif;color:#c2185b;margin:20px 0\">Ha ha ha there's nothing here, I just want you to know I love you whole heartedly neh<\u002Fdiv>\n<div style=\"font-size:48px\">💕 💖 ❤️ 💕 💖 ❤️<\u002Fdiv>\n<div style=\"margin-top:20px\"><button class=\"btn2\" sc-camel-on-click=\"{{backHome}}\">Back to stages<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv><\u002Fsc-if>\n\n<\u002Fdiv><\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1500}}\">\nconst KEY='k53_hasandi_v1';\nconst B=[\n[[\"A circular sign with a red border generally tells you that:\",[\"A hazard is ahead\",\"Something is prohibited or restricted\",\"Services are nearby\",\"Roadworks are ahead\"],1,\"Red-bordered circles are regulatory prohibitions or restrictions.\"],\n[\"A blue circular sign normally shows:\",[\"A warning\",\"A compulsory instruction (command)\",\"A distance\",\"A prohibition\"],1,\"Blue circles are command signs you must obey.\"],\n[\"A traffic officer waves you through while your light is red. You:\",[\"Stop for the light\",\"Obey the officer\",\"Wait for green\",\"Go when it is clear\"],1,\"A traffic officer's signal overrides lights and signs.\"],\n[\"At a four-way stop, two vehicles arrive one after the other. Who goes first?\",[\"The larger vehicle\",\"The one that arrived first\",\"The one on the left\",\"The faster one\"],1,\"First to stop is first to go.\"],\n[\"The inverted red-bordered triangle sign means you must:\",[\"Stop and wait for a signal\",\"Give way to traffic on the road you are joining\",\"Slow to 30 km/h\",\"Turn left\"],1,\"It is the yield (give way) sign.\"],\n[\"Unless signed otherwise, the maximum speed in an urban area is:\",[\"50 km/h\",\"60 km/h\",\"80 km/h\",\"70 km/h\"],1,\"60 km/h applies in urban areas.\"],\n[\"You are not allowed to overtake across:\",[\"A broken white line\",\"A solid barrier line on your side\",\"A faint edge line\",\"Any line in daytime\"],1,\"A barrier line on your side prohibits overtaking.\"],\n[\"Your hooter may be used:\",[\"To thank other drivers\",\"To warn of danger\",\"To greet pedestrians\",\"To signal you are overtaking at night\"],1,\"The hooter is only for warning.\"],\n[\"Who is responsible for wearing a seat belt in a car?\",[\"Only the driver\",\"Every occupant where belts are fitted\",\"Only front seat occupants\",\"Only on freeways\"],1,\"Every occupant where a belt is fitted.\"],\n[\"The legal blood alcohol limit for an ordinary driver is:\",[\"0.02 g/100 ml\",\"0.05 g/100 ml\",\"0.08 g/100 ml\",\"0.10 g/100 ml\"],1,\"0.05 g per 100 ml of blood.\"]],\n[[\"A triangle with a red border and white background is a:\",[\"Command sign\",\"Warning sign\",\"Guidance sign\",\"Parking sign\"],1,\"Triangles warn of a hazard ahead.\"],\n[\"A robot (traffic light) is dead at an intersection. It must be treated as:\",[\"A yield\",\"A four-way stop\",\"A free-flow junction\",\"A closed road\"],1,\"Dead lights equal a four-way stop.\"],\n[\"A pedestrian is already on a crossing in front of you. You:\",[\"Hoot and edge forward\",\"Give way and wait until they are clear\",\"Pass behind them quickly\",\"Flash your lights\"],1,\"Pedestrians on a crossing have right of way.\"],\n[\"At a roundabout you must give way to:\",[\"Traffic already in the circle from your right\",\"Traffic behind you\",\"Heavy vehicles only\",\"The fastest vehicle\"],0,\"Give way to traffic already in the circle.\"],\n[\"The traffic light changes to yellow as you approach. You:\",[\"Accelerate through\",\"Stop if you can do so safely\",\"Stop immediately wherever you are\",\"Hoot\"],1,\"Yellow means stop unless it is unsafe to do so.\"],\n[\"On an open road the general speed limit for a light vehicle is:\",[\"80 km/h\",\"100 km/h\",\"120 km/h\",\"90 km/h\"],1,\"100 km/h on rural roads.\"],\n[\"A fire-engine with sirens approaches from behind on a two-lane road. You:\",[\"Speed up to clear the road\",\"Move left and stop if needed\",\"Stop in your lane\",\"Ignore it if you have right of way\"],1,\"Pull to the left and give way.\"],\n[\"Before pulling away from the kerb you must:\",[\"Hoot\",\"Check mirrors, blind spot and signal\",\"Only signal\",\"Rev the engine\"],1,\"Check and signal before moving off.\"],\n[\"In good dry conditions the minimum following distance is:\",[\"One second\",\"Two seconds\",\"Four seconds\",\"Ten metres\"],1,\"At least a two-second gap.\"],\n[\"You may not park within what distance of an intersection?\",[\"3 m\",\"9 m\",\"15 m\",\"1 m\"],1,\"Stay 9 m clear of an intersection.\"]],\n[[\"At a T-junction, which vehicle has right of way?\",[\"The one on the terminating road\",\"Traffic on the through road\",\"The larger vehicle\",\"The first to indicate\"],1,\"Through traffic has priority.\"],\n[\"Two vehicles reach a four-way stop at exactly the same time. Who goes first?\",[\"The one on the right\",\"The one on the left\",\"The smaller one\",\"The one going straight\"],0,\"Give way to the vehicle on your right.\"],\n[\"Turning right at an intersection, you must give way to:\",[\"Oncoming traffic going straight\",\"Nobody\",\"Only pedestrians\",\"Traffic behind you\"],0,\"Oncoming straight-through traffic has priority.\"],\n[\"On a narrow hill road, who gives way when two vehicles meet?\",[\"The vehicle going downhill\",\"The vehicle going uphill\",\"The faster vehicle\",\"The wider vehicle\"],0,\"The downhill vehicle gives way to the one climbing.\"],\n[\"You turn left into a side road and pedestrians are crossing it. You:\",[\"Hoot to hurry them\",\"Give way to them\",\"Turn quickly before they step on\",\"Flash your lights\"],1,\"Pedestrians crossing the road you enter have right of way.\"],\n[\"When exiting a roundabout you should:\",[\"Signal left\",\"Signal right\",\"Not signal\",\"Hoot\"],0,\"Signal left before your exit.\"],\n[\"When joining a freeway from a slip road, you must:\",[\"Stop and wait for a gap\",\"Give way to freeway traffic and merge safely\",\"Force traffic to let you in\",\"Use the emergency lane\"],1,\"Freeway traffic has priority.\"],\n[\"Children under three must travel:\",[\"On a lap\",\"In an approved child restraint\",\"In the front seat only\",\"Unrestrained if asleep\"],1,\"Approved child restraints are required for children under 3.\"],\n[\"A scholar patrol holds up a stop sign. You must:\",[\"Slow down\",\"Stop until it is withdrawn\",\"Continue if no children are near\",\"Hoot\"],1,\"Scholar patrol signals must be obeyed.\"],\n[\"Using a hand-held cellphone while driving is:\",[\"Allowed at traffic lights\",\"Prohibited\",\"Allowed below 60 km/h\",\"Allowed on quiet roads\"],1,\"Hand-held phone use is prohibited.\"]],\n[[\"Three vehicles arrive at a four-way stop: A first, then B and C together. Who goes first?\",[\"A\",\"B\",\"C\",\"Whoever is largest\"],0,\"A arrived first and goes first.\"],\n[\"A vehicle has stopped at a pedestrian crossing ahead. You:\",[\"Overtake it\",\"Stay behind it and do not overtake\",\"Overtake on the left\",\"Hoot and pass\"],1,\"Never overtake a vehicle stopped at a crossing.\"],\n[\"Overtaking near the crest of a hill is:\",[\"Allowed in daylight\",\"Prohibited where your view is restricted\",\"Allowed above 80 km/h\",\"Allowed with hazard lights\"],1,\"Never overtake without a clear view ahead.\"],\n[\"You may overtake on the left when:\",[\"You are in a hurry\",\"The vehicle ahead is turning right and has signalled\",\"Traffic is slow\",\"You are on a freeway\"],1,\"Left overtaking is only for a vehicle turning right.\"],\n[\"You are being overtaken. You should:\",[\"Speed up\",\"Keep left and avoid accelerating\",\"Move to the centre\",\"Brake hard\"],1,\"Help the other driver pass safely.\"],\n[\"Before overtaking, the correct sequence is:\",[\"Signal, then check\",\"Mirrors, signal, blind spot, then move out\",\"Hoot, then move\",\"Check the speedometer only\"],1,\"Mirrors, signal and blind spot before moving out.\"],\n[\"A driver ahead extends the right arm horizontally. They intend to:\",[\"Turn right\",\"Turn left\",\"Slow down\",\"Stop\"],0,\"Right arm out horizontal means a right turn.\"],\n[\"A driver's right arm is bent upward at the elbow. They intend to:\",[\"Turn right\",\"Turn left\",\"Slow down\",\"Overtake\"],1,\"The upward bent arm signals a left turn.\"],\n[\"Hazard lights while the vehicle is moving are acceptable:\",[\"Whenever it rains\",\"To warn following traffic of a sudden hazard\",\"To park illegally\",\"To demand right of way\"],1,\"Only to warn of sudden danger.\"],\n[\"You must dip your headlights for oncoming traffic within about:\",[\"50 m\",\"150 m\",\"300 m\",\"500 m\"],1,\"Dip within about 150 m.\"]],\n[[\"If you double your speed, braking distance becomes about:\",[\"Twice as long\",\"Four times as long\",\"The same\",\"One and a half times\"],1,\"Braking distance rises with the square of speed.\"],\n[\"Total stopping distance is:\",[\"Braking distance\",\"Reaction distance plus braking distance\",\"Reaction distance\",\"Speed in metres\"],1,\"You travel during reaction time and braking.\"],\n[\"On a wet road, braking distance can:\",[\"Halve\",\"Roughly double\",\"Stay the same\",\"Fall by a quarter\"],1,\"Wet surfaces roughly double braking distance.\"],\n[\"A heavily loaded vehicle compared to an empty one needs:\",[\"Shorter braking distance\",\"Longer braking distance\",\"The same braking distance\",\"No gap\"],1,\"More mass means longer stopping.\"],\n[\"In thick fog you should:\",[\"Use high beams\",\"Slow down, use dipped lights and increase your gap\",\"Follow tail lights closely\",\"Drive normally\"],1,\"Dipped lights, lower speed, bigger gap.\"],\n[\"You start to aquaplane. You should:\",[\"Brake hard\",\"Ease off the accelerator and steer straight\",\"Turn sharply\",\"Speed up\"],1,\"Avoid braking or steering sharply.\"],\n[\"At night you should drive so that you can:\",[\"Out-drive your headlights\",\"Stop within the distance you can see\",\"Use high beam in traffic\",\"Follow closely\"],1,\"Never outrun your headlights.\"],\n[\"If the rear of your car skids, you should:\",[\"Brake hard\",\"Steer in the direction you want to go and ease off\",\"Accelerate\",\"Release the wheel\"],1,\"Steer where you want to go and ease off.\"],\n[\"The minimum legal tread depth across the tyre is:\",[\"0.5 mm\",\"1 mm\",\"2.5 mm\",\"3 mm\"],1,\"At least 1 mm across the tread.\"],\n[\"In heavy rain your following distance should be:\",[\"Reduced\",\"Increased\",\"The same\",\"Measured in metres only\"],1,\"Increase it as grip drops.\"]],\n[[\"A trailer with a gross mass above 750 kg must have:\",[\"Its own brakes\",\"No lights\",\"A tinted cover\",\"A speed limiter\"],0,\"Heavier trailers must be braked.\"],\n[\"A load projecting at the rear must be marked by day with:\",[\"A red flag\",\"A blue cloth\",\"Nothing\",\"A white cone\"],0,\"A red flag by day, red light at night.\"],\n[\"The maximum legal height of a vehicle with load is:\",[\"3.5 m\",\"4.3 m\",\"5.0 m\",\"6.0 m\"],1,\"4.3 m is the limit.\"],\n[\"A vehicle being towed must have:\",[\"Nobody inside\",\"A competent person in control of it\",\"Its doors locked\",\"Its lights off\"],1,\"Someone must control steering and braking.\"],\n[\"The speed limit for a goods vehicle over 9000 kg GVM outside urban areas is:\",[\"80 km/h\",\"100 km/h\",\"120 km/h\",\"60 km/h\"],0,\"Heavy vehicles are limited to 80 km/h.\"],\n[\"Your trailer begins to sway. You should:\",[\"Brake hard\",\"Ease off the accelerator and keep steering straight\",\"Accelerate\",\"Swerve\"],1,\"Hard braking worsens sway.\"],\n[\"When reversing with a trailer, to send the trailer left you:\",[\"Steer left\",\"Steer right\",\"Hold the wheel straight\",\"Use the handbrake\"],1,\"The trailer goes the opposite way to your steering.\"],\n[\"An unsecured load that falls off is the responsibility of:\",[\"The road authority\",\"The driver\",\"The next driver\",\"Nobody\"],1,\"The driver must secure the load.\"],\n[\"Overloading a vehicle mainly causes:\",[\"Better grip\",\"Reduced braking ability and handling\",\"Lower fuel use\",\"Shorter reaction time\"],1,\"It lengthens stopping and harms control.\"],\n[\"On an open road, a broken-down vehicle's warning triangle goes at least:\",[\"10 m behind\",\"45 m behind\",\"100 m ahead\",\"Beside it\"],1,\"45 m behind the vehicle.\"],\n[\"Before towing a trailer, check:\",[\"Only the radio\",\"Coupling, safety chain and trailer lights\",\"The fuel cap\",\"The wiper blades only\"],1,\"A faulty hitch or lights is dangerous.\"],\n[\"A heavy vehicle descending a long hill should use:\",[\"Neutral\",\"The gear it would use to climb the hill\",\"Top gear\",\"The clutch to control speed\"],1,\"Same gear down as up prevents brake fade.\"]],\n[[\"On a narrow bridge, you should:\",[\"Race the other driver\",\"Give way to a vehicle already on it\",\"Flash and enter\",\"Stop in the middle\"],1,\"A vehicle already on the bridge has priority.\"],\n[\"At a level crossing with flashing signals you must:\",[\"Cross quickly\",\"Stop and wait\",\"Slow and cross\",\"Hoot\"],1,\"Stop and never cross while signals flash.\"],\n[\"Good defensive observation means looking:\",[\"Only at the bumper ahead\",\"Far ahead and scanning continuously\",\"Only in mirrors\",\"At the dashboard\"],1,\"Scan far ahead and all around.\"],\n[\"Why must you stay out of a truck's blind spots?\",[\"Its horn is loud\",\"If you cannot see its mirrors, the driver cannot see you\",\"It cannot brake\",\"It is wider\"],1,\"Large vehicles have large blind spots.\"],\n[\"You notice brake lights several vehicles ahead. You should:\",[\"Ignore them\",\"Ease off early\",\"Tailgate\",\"Overtake\"],1,\"React early to the traffic ahead.\"],\n[\"Passing a cyclist you should:\",[\"Hoot\",\"Leave generous space and pass only when safe\",\"Stay close\",\"Overtake at speed\"],1,\"Give cyclists plenty of room.\"],\n[\"Passing parked cars, you should expect:\",[\"Nothing\",\"Doors opening and people stepping out\",\"Faster traffic\",\"A clear road\"],1,\"Leave a wide gap.\"],\n[\"A front tyre blows out while driving. You should:\",[\"Brake hard\",\"Hold the wheel firmly and ease off gently\",\"Swerve\",\"Accelerate\"],1,\"Hold the line and slow smoothly.\"],\n[\"Your brakes fail. You should first:\",[\"Switch off the engine\",\"Pump the pedal, shift down and use the handbrake gradually\",\"Jump out\",\"Hoot only\"],1,\"Pump, shift down, then handbrake carefully.\"],\n[\"Oncoming headlights dazzle you. You should:\",[\"Stare at them\",\"Look to the left edge of the road and slow down\",\"Close your eyes\",\"Flash back\"],1,\"Use the left edge as a guide.\"],\n[\"A child's ball rolls into the road. You:\",[\"Continue\",\"Slow and expect a child to follow\",\"Hoot\",\"Swerve\"],1,\"A child often follows a ball.\"],\n[\"A pedestrian steps out from behind a parked van. This shows you should:\",[\"Trust no one\",\"Drive at a speed that lets you stop for hidden hazards\",\"Hoot more\",\"Use high beams\"],1,\"Anticipate hidden hazards.\"]],\n[[\"A motorcyclist and passenger must:\",[\"Wear helmets\",\"Wear helmets only on freeways\",\"Wear helmets at night\",\"Be exempt in towns\"],0,\"Helmets are compulsory for rider and passenger.\"],\n[\"On a motorcycle, the most effective braking comes from:\",[\"The rear brake only\",\"The front brake used with the rear\",\"Neither\",\"Engine only\"],1,\"Use both brakes; the front gives most stopping power.\"],\n[\"A motorcycle passenger must sit:\",[\"On the fuel tank\",\"Behind the rider on a proper seat with footrests\",\"Beside the rider\",\"Anywhere\"],1,\"A proper seat and footrests are required.\"],\n[\"When cornering a motorcycle you should look:\",[\"At the front wheel\",\"Through the corner to where you want to go\",\"At the speedometer\",\"At the kerb\"],1,\"The bike follows your gaze.\"],\n[\"On wet roads a rider should:\",[\"Brake and lean harder\",\"Use smooth inputs and increase following distance\",\"Ride faster\",\"Ride on painted lines\"],1,\"Smooth inputs and bigger gaps.\"],\n[\"A rider should position in the lane to:\",[\"Hide beside trucks\",\"Be visible and have an escape route\",\"Stay on the oil strip\",\"Ride on the shoulder\"],1,\"Be seen and keep an escape line.\"],\n[\"For a hill start in a manual car you should:\",[\"Rev and release the handbrake\",\"Use the handbrake with the clutch point\",\"Roll back\",\"Ride the clutch\"],1,\"Use the handbrake to prevent rolling back.\"],\n[\"Engine braking is best done by:\",[\"Switching off the engine\",\"Selecting a lower gear\",\"Pressing the clutch\",\"Neutral\"],1,\"A lower gear holds speed without the brakes.\"],\n[\"A heavy vehicle with air brakes must not move until:\",[\"The radio is on\",\"The air pressure warning has cleared\",\"The wipers run\",\"The horn sounds\"],1,\"Wait for the system to build pressure.\"],\n[\"When a long vehicle turns, its rear wheels:\",[\"Follow a wider path\",\"Track inside the front wheels so you must not cut corners\",\"Track outside\",\"Follow exactly\"],1,\"Off-tracking means you need extra room.\"],\n[\"A heavy vehicle driver should keep:\",[\"A shorter gap\",\"A larger gap because stopping takes longer\",\"The same gap as a car\",\"No gap\"],1,\"Heavier vehicles need more room to stop.\"],\n[\"Riding the brakes on a long descent causes:\",[\"Cooling\",\"Brake fade\",\"Better grip\",\"Quieter brakes\"],1,\"Overheating reduces braking.\"]],\n[[\"You are being tailgated. The best response is to:\",[\"Brake hard\",\"Increase the gap ahead and let them pass\",\"Speed up\",\"Stop in the road\"],1,\"Create space and let them go.\"],\n[\"If another
